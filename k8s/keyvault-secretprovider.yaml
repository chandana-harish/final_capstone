apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pipelineiq-keyvault-secrets
  namespace: pipelineiq
spec:
  provider: azure
  secretObjects:
    - secretName: pipelineiq-kv-secrets
      type: Opaque
      data:
        - objectName: github-client-id
          key: GITHUB_CLIENT_ID
        - objectName: github-client-secret
          key: GITHUB_CLIENT_SECRET
        - objectName: github-webhook-secret
          key: GITHUB_WEBHOOK_SECRET
        - objectName: jwt-secret
          key: JWT_SECRET
        - objectName: token-encryption-key
          key: TOKEN_ENCRYPTION_KEY
        - objectName: database-url
          key: DATABASE_URL
       
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "1b7a262a-86b7-4df8-a89f-471eae9c6605"
    keyvaultName: "chandanakeyvault"
    tenantId: "63882003-3527-4e22-8cf1-2edfc751f506"
    objects: |
      array:
        - |
          objectName: github-client-id
          objectType: secret
        - |
          objectName: github-client-secret
          objectType: secret
        - |
          objectName: github-webhook-secret
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: token-encryption-key
          objectType: secret
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: gemini-api-key
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
