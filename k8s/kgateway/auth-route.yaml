apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pipelineiq-auth-route
  namespace: pipelineiq
spec:
  parentRefs:
    - name: pipelineiq-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth
      backendRefs:
        - name: auth-service
          port: 8081
