apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pipelineiq-dashboard-route
  namespace: pipelineiq
spec:
  parentRefs:
    - name: pipelineiq-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: dashboard-api
          port: 8080
