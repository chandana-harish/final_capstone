apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pipelineiq-webhook-route
  namespace: pipelineiq
spec:
  parentRefs:
    - name: pipelineiq-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/webhooks/github
      backendRefs:
        - name: webhook-service
          port: 8087
